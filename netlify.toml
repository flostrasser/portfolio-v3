# Configure Netlify builds.
[build]
  publish = "dist/"
  command = "pnpm run build"

# Security headers delivered over HTTP (not via the <meta> CSP).
#
# The XSS-critical directives (script-src / style-src with per-page hashes) are
# generated by Astro and injected as a <meta> tag; those can't live here because
# the hashes differ per page. This header carries directives that either only
# work as a header (frame-ancestors) or add defense-in-depth alongside the meta.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    # Isolate the top-level window from cross-origin openers/popups.
    Cross-Origin-Opener-Policy = "same-origin"
    # Force HTTPS for 2 years on this domain.
    Strict-Transport-Security = "max-age=63072000"
