allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: true

# Block Exotic Transitive Dependencies
# Prevents sub-dependencies from being pulled from unverified Git or URL sources.
blockExoticSubdeps: true

# --- Supply Chain Security Configurations ---

# Minimum Release Age
# Delay new versions by 24 hours (1440 mins)
# Prevents immediate installation of potentially malicious "day-zero" releases.
minimumReleaseAge: 1440

# Trust Policy
# Prevents downgrading to versions with lower trust/provenance levels.
trustPolicy: no-downgrade

# Ignore trust downgrades for packages published more than 30 days ago
# (43200 mins). Established releases (e.g. chokidar, semver) predate npm provenance
# and would otherwise be flagged as "downgrades" despite being trusted.
trustPolicyIgnoreAfter: 43200
